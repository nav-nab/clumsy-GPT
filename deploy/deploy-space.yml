name: Deploy to Hugging Face Space

# Pushes the repo to the Space whenever main changes. The Space needs a few lines of
# front matter at the top of its README. They are added here, so that the README on
# GitHub stays clean.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE: USERNAME/SPACE_NAME  # replace with your Hugging Face username and Space name
    steps:
      - uses: actions/checkout@v4

      - name: Add the Space front matter to the README
        run: |
          {
            printf '%s\n' '---' \
              'title: ClumsyGPT' \
              'emoji: 🫗' \
              'colorFrom: yellow' \
              'colorTo: red' \
              'sdk: gradio' \
              'sdk_version: 6.29.1' \
              'python_version: "3.12"' \
              'app_file: app.py' \
              'pinned: false' \
              '---' ''
            cat README.md
          } > README.space.md
          mv README.space.md README.md

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan space
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" space:main
